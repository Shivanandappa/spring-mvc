spring.application.name=spring-mvc

# Local default: H2 (no Docker required)
spring.datasource.url=jdbc:h2:mem:springmvc;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized
management.endpoint.health.probes.enabled=true

app.jwt.secret=${APP_JWT_SECRET:local-dev-secret-change-me-min-32-chars!!}
app.jwt.expiration-ms=3600000

app.cors.allowed-origins=http://localhost:8080,http://127.0.0.1:8080

server.error.include-message=never
