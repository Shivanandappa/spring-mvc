<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Anmelden – Spring MVC</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
  <main class="auth-shell">
    <section class="auth-panel">
      <p class="brand">Spring MVC</p>
      <p class="lead">Willkommen zurück. Melde dich mit deiner E-Mail an.</p>

      <div th:if="${param.error}" class="alert alert-error">E-Mail oder Passwort ist ungültig.</div>
      <div th:if="${param.logout}" class="alert alert-ok">Du wurdest abgemeldet.</div>
      <div th:if="${registered}" class="alert alert-ok">Registrierung erfolgreich. Bitte anmelden.</div>

      <form class="form-stack" th:action="@{/login}" method="post">
        <div class="field">
          <label for="email">E-Mail</label>
          <input id="email" type="email" name="email" autocomplete="username" required>
        </div>
        <div class="field">
          <label for="password">Passwort</label>
          <input id="password" type="password" name="password" autocomplete="current-password" required>
        </div>
        <button class="btn" type="submit">Anmelden</button>
      </form>

      <p class="form-footer">
        Noch kein Konto?
        <a th:href="@{/register}">Jetzt registrieren</a>
      </p>
    </section>
  </main>
</body>
</html>
