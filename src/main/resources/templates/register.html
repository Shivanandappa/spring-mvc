<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Registrieren – Spring MVC</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
  <main class="auth-shell">
    <section class="auth-panel">
      <p class="brand">Spring MVC</p>
      <p class="lead">Neues Konto anlegen – Vorname, Nachname, E-Mail und Passwort.</p>

      <form class="form-stack" th:action="@{/register}" th:object="${form}" method="post">
        <div class="field">
          <label for="firstName">Vorname</label>
          <input id="firstName" type="text" th:field="*{firstName}" autocomplete="given-name" required>
          <span class="error" th:if="${#fields.hasErrors('firstName')}" th:errors="*{firstName}"></span>
        </div>
        <div class="field">
          <label for="lastName">Nachname</label>
          <input id="lastName" type="text" th:field="*{lastName}" autocomplete="family-name" required>
          <span class="error" th:if="${#fields.hasErrors('lastName')}" th:errors="*{lastName}"></span>
        </div>
        <div class="field">
          <label for="email">E-Mail</label>
          <input id="email" type="email" th:field="*{email}" autocomplete="email" required>
          <span class="error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span>
        </div>
        <div class="field">
          <label for="password">Passwort</label>
          <input id="password" type="password" th:field="*{password}" autocomplete="new-password" required minlength="8">
          <span class="error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></span>
        </div>
        <button class="btn" type="submit">Registrieren</button>
      </form>

      <p class="form-footer">
        Bereits registriert?
        <a th:href="@{/login}">Zur Anmeldung</a>
      </p>
    </section>
  </main>
</body>
</html>
