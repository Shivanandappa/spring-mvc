services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: springmvc
      POSTGRES_USER: springmvc
      POSTGRES_PASSWORD: localdev
    ports:
      - "5432:5432"
    volumes:
      - pgdata_local:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U springmvc -d springmvc"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata_local:
